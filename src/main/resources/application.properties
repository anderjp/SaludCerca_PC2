spring.application.name=SaludCerca
server.port=8082
# La sesión solo viaja por cookie (evita el ";jsessionid=" en las direcciones)
server.servlet.session.tracking-modes=cookie

# ===== Base de datos: MySQL / MariaDB (XAMPP) =====
spring.datasource.url=jdbc:mysql://localhost:3306/saludcerca?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=

# ===== JPA / Hibernate =====
# 'none': el esquema lo crea el script de la PC1 (db/SaludCerca_Script_BD.sql).
# Hibernate NO altera tablas; solo mapea las entidades para leer/escribir filas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# El "MySQL" de XAMPP es MariaDB: fijamos el dialecto para evitar el aviso de version
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ===== Thymeleaf (desarrollo) =====
spring.thymeleaf.cache=false

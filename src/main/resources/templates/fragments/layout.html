<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${titulo} · SaludCerca|">SaludCerca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/saludcerca.css}">
</head>
<body>

<!-- Marca + navegación por rol -->
<header th:fragment="brandbar(rol)" class="brandbar">
    <a class="brand" th:href="@{/}">
        <div class="brand-mark"></div>
        <div class="brand-name">Salud<span>Cerca</span></div>
    </a>
    <nav class="role-nav">
        <a th:href="@{/paciente}" th:classappend="${rol == 'paciente'} ? 'on'">Paciente</a>
        <a th:href="@{/medico}" th:classappend="${rol == 'medico'} ? 'on'">Médico</a>
        <a th:href="@{/admin}" th:classappend="${rol == 'admin'} ? 'on'">Administrador</a>
    </nav>
</header>

<!-- Pasos del flujo (igual que en los prototipos de la PC1) -->
<div th:fragment="stepper(pasos, actual)" class="stepper">
    <div class="step" th:each="p, st : ${pasos}"
         th:classappend="${st.index == actual ? 'active' : (st.index lt actual ? 'done' : '')}">
        <div class="dot" th:text="${st.count}">1</div>
        <div class="step-label" th:text="${p}">Paso</div>
    </div>
</div>

<!-- Pestañas del administrador -->
<nav th:fragment="adminnav(actual)" class="subnav">
    <a th:href="@{/admin}" th:classappend="${actual == 'panel'} ? 'on'">Panel</a>
    <a th:href="@{/admin/medicos}" th:classappend="${actual == 'medicos'} ? 'on'">Verificar médicos</a>
    <a th:href="@{/admin/catalogo}" th:classappend="${actual == 'catalogo'} ? 'on'">Catálogo</a>
    <a th:href="@{/admin/reportes}" th:classappend="${actual == 'reportes'} ? 'on'">Reportes</a>
    <a th:href="@{/admin/configuracion}" th:classappend="${actual == 'configuracion'} ? 'on'">Configuración</a>
</nav>

<!-- Mensajes de error / éxito -->
<th:block th:fragment="alertas">
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-ok" th:if="${ok}" th:text="${ok}"></div>
</th:block>

<footer th:fragment="footer" class="footnote">
    SaludCerca · PC2 Diseño de Patrones · UTP —
    <a th:href="@{/demo/creacionales}">Laboratorio de patrones</a>
</footer>

</body>
</html>
